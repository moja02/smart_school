services:
  - type: web
    name: smart-school
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: SmartSchool
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: smart-school-db
          property: connectionString

databases:
  - name: smart-school-db
    plan: free
    region: frankfurt
    databaseName: smart_school
    user: smart_school_user
